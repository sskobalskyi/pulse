name: pulse

# `docker compose up --build` starts everything: dashboard on http://localhost:8080, API on http://localhost:5080.
# For development run only the infrastructure (`docker compose up -d redpanda timescaledb`)
# and start the API, simulator and web app from source.

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 10s
      retries: 20

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Pulse.Api/Dockerfile
    environment:
      Kafka__BootstrapServers: redpanda:9092
      ConnectionStrings__Timescale: Host=timescaledb;Port=5432;Database=pulse;Username=pulse;Password=pulse
      Cors__Origins__0: http://localhost:8080
    ports:
      - "5080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: src/Pulse.Simulator/Dockerfile
    environment:
      Simulator__ApiUrl: http://api:8080
    depends_on:
      - api
    restart: on-failure

  web:
    build:
      context: web
    ports:
      - "8080:80"
    depends_on:
      - api

  # Not part of `docker compose up`. Run it with: docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6:2.3.0
    profiles: [loadtest]
    command: run /scripts/smoke.js
    environment:
      BASE_URL: http://api:8080
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      - api

volumes:
  timescale-data:
